# Deploy da Ryber no Render — tier gratuito no lançamento.
#
# IMPORTANTE (lembrete crítico): o Postgres free do Render é apagado automaticamente
# após 30 dias. Migre o banco e o serviço de backend para o plano Starter (e adicione um
# disco persistente em /var/data) antes desse prazo, ou os dados reais serão perdidos.
# Sem disco persistente, os vídeos brutos em /var/data também podem ser perdidos a
# qualquer reinício do serviço, mesmo antes dos 30 dias — isso é esperado no tier free.

databases:
  - name: ryber-db
    plan: free
    databaseName: ryber
    user: ryber

services:
  - type: web
    name: ryber-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ryber-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: MAX_FRAMES
        value: "40"
      - key: CORS_ORIGIN
        sync: false
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_START
        sync: false
      - key: STRIPE_PRICE_ID_PLATINUM
        sync: false
      - key: STRIPE_PRICE_ID_GOLD
        sync: false
      - key: FRONTEND_URL
        sync: false

# Frontend agora é hospedado na Vercel (https://ryber.vercel.app), não mais aqui.
# O serviço "ryber-frontend" antigo pode ser apagado manualmente no painel do Render
# quando você confirmar que a Vercel está funcionando bem.
