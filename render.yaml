# Deploy da Ryber no Render.
#
# Banco de dados: Supabase Postgres (não é mais gerenciado pelo Render — ver DATABASE_URL
# abaixo, preenchida manualmente no painel). Frontend: Vercel (https://ryber.vercel.app).
#
# IMPORTANTE (lembrete crítico): sem disco persistente (que exige plano pago), os vídeos
# brutos em /var/data podem ser perdidos a qualquer reinício do serviço — isso é esperado
# enquanto o backend estiver no tier gratuito.

services:
  - type: web
    name: ryber-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: MAX_FRAMES
        value: "40"
      - key: CORS_ORIGIN
        sync: false
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_START
        sync: false
      - key: STRIPE_PRICE_ID_PLATINUM
        sync: false
      - key: STRIPE_PRICE_ID_GOLD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: REDIS_URL
        sync: false

  # Processa as análises em segundo plano (fila RQ) — separado do serviço web de
  # propósito, pra ffmpeg/Whisper não travarem/derrubarem quem está servindo HTTP.
  - type: worker
    name: ryber-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./start_worker.sh
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: WHISPER_MODEL_SIZE
        value: base
      - key: MAX_FRAMES
        value: "40"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: REDIS_URL
        sync: false

# Frontend agora é hospedado na Vercel (https://ryber.vercel.app), não mais aqui.
# O serviço "ryber-frontend" antigo pode ser apagado manualmente no painel do Render
# quando você confirmar que a Vercel está funcionando bem.
#
# IMPORTANTE: ryber-worker está no plano Starter (serviços "worker" não existem no tier
# gratuito do Render). ryber-backend ainda está no tier gratuito — isso ainda pode causar
# lentidão/hibernação nele, mesmo com o processamento pesado já isolado no worker. A
# Fase 6 (upgrade do backend também) é o que resolve isso de vez.
